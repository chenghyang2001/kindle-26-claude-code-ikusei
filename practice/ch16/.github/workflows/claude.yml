# 互動模式：在 issue / PR 留言中提到 @claude 時，由 Claude 回應或動手修改
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 只有內容真的含 @claude 才跑，避免每則留言都燒 API 額度
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # 需要推送 Claude 建立的分支 / commit
      pull-requests: write   # 在 PR 留言、開 PR
      issues: write          # 在 issue 留言
      id-token: write        # OIDC，action 用來換取 GitHub token
      actions: read          # 讓 Claude 讀取 CI 結果
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 執行 Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
