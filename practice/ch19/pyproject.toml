[project]
name = "ledger"
version = "0.1.0"
description = "命令列記帳小工具（K26 第 19 章 Spec Kit 練習）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
